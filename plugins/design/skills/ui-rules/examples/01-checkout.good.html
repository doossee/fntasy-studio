<!doctype html>
<!-- Viewport: 390 x 844 (phone), light theme, English. Fictional product: Acme Shop. Training example, good version. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme Shop — Payment</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1d1f;background:#f4f4f6}
.sheet{background:#fff;min-height:844px;padding:16px 16px 24px;border-radius:14px 14px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.top h1{font:600 19px/1.2 Georgia,serif;margin:0}
.close{min-width:44px;height:44px;border:0;background:none;font:inherit;color:#3a3a40;padding:0 4px}
.methods{display:flex;gap:8px;margin:12px 0 16px}
.methods button{flex:1;height:44px;background:#fff;border:1px solid #8a8a92;border-radius:8px;font:inherit;font-size:15px}
.methods button[aria-pressed=true]{border:2px solid #5b30c4;font-weight:600}
label.l{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
.field{margin:0 0 12px}
.field input{width:100%;height:48px;border:1px solid #8a8a92;border-radius:8px;padding:0 12px;font:inherit;color:#1d1d1f}
.field input.bad{border:2px solid #b42318}
.msg{display:flex;gap:6px;color:#b42318;font-size:14px;margin-top:4px}
.row{display:flex;gap:12px}.row .field{flex:1}
.lines{margin:16px 0 8px;font-size:15px;color:#3a3a40}
.lines div{display:flex;justify-content:space-between;padding:3px 0}
.addon{display:flex;gap:12px;align-items:flex-start;margin:12px 0 16px;padding:12px;border:1px solid #d0d0d5;border-radius:12px;font-size:15px}
.addon input{width:22px;height:22px;margin:1px 0 0}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:24px;color:#1d1d1f;margin:12px 0 16px}
.pay{width:100%;height:52px;border:0;border-radius:14px;background:#5b30c4;color:#fff;font:600 17px/1 system-ui,sans-serif}
.pay:focus-visible,.close:focus-visible,input:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
</style></head><body>
<div class="sheet">
  <div class="top"><h1>Payment</h1><button class="close">Close</button></div>
  <div class="methods"><button aria-pressed="true">Card</button><button aria-pressed="false">Wallet</button><button aria-pressed="false">Bank</button></div>
  <div class="field"><label class="l" for="card">Card number</label>
    <input id="card" class="bad" inputmode="numeric" autocomplete="cc-number" value="4111 1111 1111 11" aria-describedby="card-e" aria-invalid="true">
    <div class="msg" id="card-e"><span aria-hidden="true">⚠</span>Card number is 2 digits short</div></div>
  <div class="row">
    <div class="field"><label class="l" for="exp">Expiry (MM/YY)</label><input id="exp" inputmode="numeric" value="09/27"></div>
    <div class="field"><label class="l" for="cvc">Security code</label><input id="cvc" inputmode="numeric" value="123"></div>
  </div>
  <div class="field"><label class="l" for="name">Name on card</label><input id="name" autocomplete="cc-name" value="Mira Tal"></div>
  <div class="lines">
    <div><span>2 items</span><span>$46.00</span></div>
    <div><span>Delivery</span><span>$3.90</span></div>
    <div><span>Service fee (shown in cart)</span><span>$1.50</span></div>
  </div>
  <label class="addon"><input type="checkbox"><span><b>Add package protection, $4.99</b><br>Covers loss and damage in transit.</span></label>
  <div class="total"><span>Total</span><span>$51.40</span></div>
  <button class="pay">Pay $51.40</button>
</div>
</body></html>
