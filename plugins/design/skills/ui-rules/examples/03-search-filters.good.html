<!doctype html>
<!-- Viewport: 390 x 844 (phone), light theme, Russian. Fictional product: Acme Shop. Training example, good version.
     State: the same search after loading finished with no results; filters stay visible and can be removed. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme Shop — Поиск</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b1b1f;background:#fff;height:844px;overflow:hidden;position:relative}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px}
.search{flex:1;position:relative}
.search input{width:100%;height:44px;border-radius:22px;border:1px solid #8b8b93;padding:0 48px 0 16px;font:inherit}
.clear{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;font-size:18px;color:#55555c}
.fbtn{height:44px;border:1px solid #8b8b93;border-radius:22px;background:#fff;font:inherit;font-size:15px;padding:0 14px}
.fbtn b{display:inline-block;min-width:20px;border-radius:10px;background:#1d6b3a;color:#fff;font-size:13px;margin-inline-start:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:36px;border-radius:18px;border:1px solid #1d6b3a;color:#1d6b3a;padding:0 4px 0 12px;font-size:14px;background:#fff}
.chip span{display:inline-block;width:32px;height:32px;line-height:32px;text-align:center}
.reset{border:0;background:none;color:#1d6b3a;text-decoration:underline;font:inherit;font-size:14px;height:36px}
.empty{padding:32px 24px 0}
.empty h2{font-size:20px;margin:0 0 8px}
.empty p{color:#55555c;margin:0 0 16px}
.empty .fix{display:block;width:100%;height:48px;margin:0 0 10px;border-radius:12px;font:inherit;font-weight:600}
.primary{background:#1d6b3a;color:#fff;border:0}.secondary{background:#fff;color:#1d6b3a;border:1px solid #1d6b3a}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;border-top:1px solid #e4e4e8;display:flex;justify-content:space-around;align-items:center;background:#fff}
.tabbar a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#55555c;text-decoration:none;min-width:56px}
.tabbar a span{font-size:20px;line-height:24px}
</style></head><body>
<div class="bar">
  <div class="search"><input value="кросовки детские" aria-label="Поиск товаров"><button class="clear" aria-label="Очистить запрос">×</button></div>
  <button class="fbtn">Фильтры<b>3</b></button>
</div>
<div class="chips">
  <button class="chip">Размер 31<span aria-label="Убрать">×</span></button>
  <button class="chip">До 1000 ₽<span aria-label="Убрать">×</span></button>
  <button class="chip">Бренд: Акме Кидс<span aria-label="Убрать">×</span></button>
  <button class="reset">Сбросить всё</button>
</div>
<div class="empty">
  <h2>Нет товаров с этими фильтрами</h2>
  <p>По запросу «кроссовки детские» есть 48 товаров, но ни одного до 1000 ₽ в размере 31.</p>
  <button class="fix primary">Показать до 1500 ₽ — 6 товаров</button>
  <button class="fix secondary">Сбросить фильтры — 48 товаров</button>
  <p>Вы искали «кросовки». Показаны результаты для «кроссовки».</p>
</div>
<nav class="tabbar"><a href="#"><span>⌂</span>Главная</a><a href="#"><span>⌗</span>Сканер</a><a href="#"><span>⇄</span>Сравнение</a><a href="#"><span>🛒</span>Корзина</a><a href="#"><span>☺</span>Профиль</a></nav>
</body></html>
