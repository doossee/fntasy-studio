<!doctype html>
<!-- Viewport: 390 x 844 (phone), dark theme, English. Fictional product: Acme courier app. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme Courier — Stop 4 of 9</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#121212;color:#f2f2f2;height:844px;overflow:hidden;position:relative}
.map{height:300px;background:repeating-linear-gradient(45deg,#1b1f24 0 14px,#1e2329 14px 28px);position:relative}
.pin{position:absolute;left:180px;top:120px;width:24px;height:24px;border-radius:50% 50% 50% 0;background:#4da3ff;transform:rotate(-45deg)}
.panel{padding:16px}
.k{font-size:13px;color:#9a9aa0;margin:0}
.name{font-size:20px;font-weight:700;margin:2px 0 4px}
.addr{color:#5a5a60;font-size:15px;margin:0 0 12px}
.note{background:#1e1e1e;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.hint{font-size:13px;color:#9a9aa0;text-align:center;margin:10px 0}
.acts{display:flex;justify-content:flex-end;gap:4px;align-items:center}
.acts button{width:32px;height:32px;border-radius:8px;border:0;font-size:16px}
.a1{background:#2e7d32;color:#fff}.a2{background:#3a3a3a;color:#ff6b6b}
.mono{font-family:ui-monospace,Menlo,monospace;color:#9a9aa0}
.toast{position:absolute;left:16px;right:16px;bottom:24px;background:#2b2b2b;border-radius:10px;padding:12px 14px;font-size:14px}
</style></head><body>
<div class="map"><span class="pin"></span></div>
<div class="panel">
  <p class="k">Stop 4 of 9 · <span class="mono">#A-20931</span></p>
  <div class="acts"><button class="a1" aria-label="Done">✓</button><button class="a2" aria-label="Cancel order">⊘</button></div>
  <p class="name">Lena Ortiz</p>
  <p class="addr">14 Harbour Lane, flat 3B, 2nd floor, entrance from the yard</p>
  <p class="note">Door code: see order details</p>
  <p class="hint">Swipe left to report a problem</p>
</div>
<div class="toast">Order marked as delivered</div>
</body></html>
